<!doctype html>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 500px; height: 950px; overflow: hidden; background: #2b2b2b; }
  iframe { display: block; width: 390px; height: 844px; border: 0; background: #050914; }
</style>
<iframe id="preview" title="QA preview"></iframe>
<script>
  const query = new URLSearchParams(location.search);
  const scene = query.get('scene') || 'intro';
  preview.style.width = `${Number(query.get('w')) || 390}px`;
  preview.style.height = `${Number(query.get('h')) || 844}px`;
  preview.src = `./?preview=${encodeURIComponent(scene)}&qa=${Date.now()}`;
</script>
